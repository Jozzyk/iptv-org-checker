name: Check IPTV playback stalls

on:
  workflow_dispatch:
    inputs:
      alternate_lists:
        description: Verify public directory candidates for sharing in the US
        type: boolean
        default: false
      red_only:
        description: Test .red HD and its alternate sources for 90 seconds
        type: boolean
        default: false

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install FFmpeg if needed
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Measure video delivery directly
        env:
          ALTERNATE_LISTS: ${{ inputs.alternate_lists }}
          RED_ONLY: ${{ inputs.red_only }}
        run: |
          curl -fsSL --retry 2 --max-time 30 https://jozzyk.github.io/iptv-org-checker/playlist-by-language.m3u -o playlist.m3u
          python3 -u - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          from urllib.request import urlopen
          from threading import Timer
          from time import monotonic

          names = ('360°', 'Amedia Hit', 'Animal Planet (Russia)', 'Discovery Channel (Russia)',
                   'Dom kino Premium HD', 'Match! Ultra', 'Mir 24', 'Russia-1 HD',
                   'STS HD', 'TV-3 HD', 'TLC (Russia)', 'RTVi US')
          entries = {}
          options = {'http-user-agent': '-user_agent', 'http-referrer': '-referer', 'http-referer': '-referer'}
          title = None
          for line in Path('playlist.m3u').read_text(encoding='utf-8').splitlines():
              if line.startswith('#EXTINF:'):
                  title = line.rsplit(',', 1)[-1].removesuffix(' (1080p)') if 'group-title="Русский"' in line and line.endswith(' (1080p)') else None
                  flags = []
              elif title and line.startswith('#EXTVLCOPT:'):
                  key, _, value = line.removeprefix('#EXTVLCOPT:').partition('=')
                  if key in options and value:
                      flags.extend((options[key], value))
              elif title and line and not line.startswith('#'):
                  entries[title] = (line, flags)
                  title = None

          duration = 35
          if os.environ.get('RED_ONLY') == 'true':
              duration = 90
              names = ('.red HD',)
              with urlopen('https://iptv-org.github.io/api/streams.json', timeout=20) as source:
                  variants = json.load(source)
              alternatives = [item for item in variants if item.get('channel') == 'red.ru' and item.get('quality') == '576p']
              for number, item in enumerate(alternatives, 1):
                  name = f'.red 576p (source {number})'
                  flags = []
                  for key, flag in (('user_agent', '-user_agent'), ('referrer', '-referer')):
                      if item.get(key):
                          flags.extend((flag, item[key]))
                  entries[name] = (item['url'], flags)
                  names += (name,)

          def probe(name):
              if name not in entries:
                  return (name, 'NOT_FOUND', '-', '-', '-')
              url, flags = entries[name]
              started = monotonic()
              with subprocess.Popen(
                  ['ffmpeg', '-nostdin', '-hide_banner', '-loglevel', 'error',
                   '-stats_period', '0.5', '-progress', 'pipe:1', '-readrate', '1',
                   '-protocol_whitelist', 'http,https,tls,tcp,udp,crypto,rtmp,rtmps,mmsh,srt',
                   '-rw_timeout', '10000000', *flags, '-i', url,
                   '-map', '0:v:0', '-c', 'copy', '-t', str(duration), '-f', 'null', '-'],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True,
              ) as proc:
                  timer = Timer(duration + 25, proc.kill)
                  timer.start()
                  first = last = None
                  media_us = pauses = 0
                  largest = 0.0
                  try:
                      for line in proc.stdout:
                          key, _, value = line.strip().partition('=')
                          if key != 'out_time_us' or value == 'N/A':
                              continue
                          stamp = int(value)
                          if stamp <= media_us:
                              continue
                          now = monotonic()
                          if last is not None:
                              gap = now - last
                              largest = max(largest, gap)
                              pauses += gap >= 5
                          else:
                              first = now
                          media_us, last = stamp, now
                      code = proc.wait()
                  finally:
                      timer.cancel()
              if first is None:
                  return (name, 'NO_VIDEO', '-', '-', '-')
              if code or media_us < (duration - 2) * 1_000_000:
                  result = 'INCOMPLETE'
              else:
                  result = 'STALLED' if pauses else 'NO_LONG_STALL'
              return (name, result, f'{first-started:.1f}', f'{largest:.1f}', f'{media_us/1e6:.1f}')

          if os.environ.get('ALTERNATE_LISTS') == 'true':
              duration = 35
              entries = {}
              names = ()
              sources = (
                  ('Doubo RU', 'https://cdn.jsdelivr.net/gh/streamline-iptv/iptv-playlists@dist/languages/rus.m3u', (
                      'RTVi US (1080p)', 'Настоящее Время (1080p)', 'DW Russian (1080p)',
                      'Euronews Russian (720p)', 'ETV+ (720p)', 'РБК-ТВ', 'NTV HD (1080p)',
                      'Russia-K HD (1080p)', 'Moldova 1 (1080p)', 'Moy mir (720p)',
                      'Три Ангела (720p)', 'Silk Way (1080p)', 'Istoki (1080p)',
                  )),
                  ('Doubo UA', 'https://cdn.jsdelivr.net/gh/streamline-iptv/iptv-playlists@dist/countries/ua.m3u', (
                      'EWTN Ukraine (1080p)', 'IRT (720p)', 'Pervyy gorodskoy Odessa',
                      'Telekanal RAI (480p)', 'Ланет.TV (486p)',
                  )),
              )
              for provider, url, sample in sources:
                  names += tuple(f'{provider}: {title}' for title in sample)
                  title = None
                  try:
                      with urlopen(url, timeout=15) as source:
                          playlist = source.read().decode('utf-8-sig')
                  except OSError as error:
                      print(f'{provider}: {error}', flush=True)
                      continue
                  for line in playlist.splitlines():
                      if line.startswith('#EXTINF:'):
                          title = line.rsplit(',', 1)[-1].strip()
                          flags = []
                      elif title in sample and line.startswith('#EXTVLCOPT:'):
                          key, _, value = line.removeprefix('#EXTVLCOPT:').partition('=')
                          if key in options and value:
                              flags.extend((options[key], value))
                      elif title in sample and line.startswith(('http://', 'https://')):
                          entries[f'{provider}: {title}'] = (line, flags)
                          title = None
              try:
                  with urlopen('https://www.cloudflare.com/cdn-cgi/trace', timeout=8) as trace:
                      location = next(line for line in trace.read().decode().splitlines() if line.startswith('loc='))
                  print('Runner egress country:', location.removeprefix('loc='))
              except (OSError, StopIteration):
                  print('Runner egress country: unavailable')

          print('CHANNEL | RESULT | START_SECONDS | LONGEST_GAP_SECONDS | VIDEO_SECONDS')
          with ThreadPoolExecutor(max_workers=6) as executor:
              for row in executor.map(probe, names):
                  url = entries.get(row[0], ('', []))[0]
                  digest = hashlib.sha256(url.encode()).hexdigest()[:12]
                  print(' | '.join((*row, digest)), flush=True)
          PY
